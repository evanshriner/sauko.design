<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sauko design</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      // If deployed under username.github.io/repo/, keep 1 segment; for custom domain, keep 0
      var pathSegmentsToKeep = (l.hostname.indexOf('github.io') > -1 && pathSegments.length > 0) ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.host +
        (pathSegmentsToKeep ? '/' + pathSegments.slice(0, pathSegmentsToKeep).join('/') : '') +
        '/?/' +
        pathSegments.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
