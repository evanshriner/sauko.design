<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.878
        0 0 0 0 0.812
        0 0 0 0 0.678
        0 0 0 0.7 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="#0d0d0c" stroke="#e0cfad" stroke-opacity="0.25" stroke-width="1" />
  <!-- Lead-in subtle audio rail -->
  <line x1="4" y1="9" x2="8" y2="9" stroke="#e0cfad" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round" />
  <line x1="24" y1="23" x2="28" y2="23" stroke="#e0cfad" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round" />
  <!-- Smooth resonant S curve -->
  <path d="M 23 9 C 23 6.6 20 5.8 16 5.8 C 10.2 5.8 8 9 8 12.2 C 8 15.6 11.5 16.6 16 17.2 C 20.5 17.8 24 19 24 22.4 C 24 25.8 20.8 26.8 16 26.8 C 11 26.8 8.2 25 8 23" 
        fill="none" stroke="#f1ede8" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" filter="url(#waveGlow)" />
  <!-- Center active signal node -->
  <rect x="14.25" y="15.5" width="3.5" height="3.5" rx="0.75" fill="#e0cfad" filter="url(#nodeGlow)" />
</svg>